
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - 9090:9090
    volumes:
      - prometheus_data:/prometheus
      - /opt/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/monitoring/homelab_alerts.yml:/etc/prometheus/homelab_alerts.yml:ro
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - apparmor:unconfined

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - 8080:8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    ports:
      - 9115:9115
    command:
      - '--config.file=/config/blackbox.yml'
    volumes:
      - /opt/monitoring/blackbox.yml:/config/blackbox.yml:ro
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - apparmor:unconfined

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Keycloak
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=Grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=AzRx4tRMVjK6n8lGYVAxQJGbWBaM6ZpD
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid,email,profile
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=http://10.0.1.14:5252/realms/master/protocol/openid-connect/auth
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=http://10.0.1.14:5252/realms/master/protocol/openid-connect/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=http://10.0.1.14:5252/realms/master/protocol/openid-connect/userinfo
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN=false
      - GF_SERVER_ROOT_URL=http://10.0.1.7:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - /opt/monitoring/provisioning/:/etc/grafana/provisioning/:ro
      - /opt/monitoring/dashboards/:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - apparmor:unconfined

  pihole-exporter:
    image: ekofr/pihole-exporter:latest
    container_name: pihole-exporter
    ports:
      - 9617:9617
    environment:
      - PIHOLE_HOSTNAME=10.0.0.2
      - PIHOLE_PASSWORD=${PIHOLE_PASSWORD}
      - PIHOLE_PROTOCOL=http
      - PIHOLE_PORT=80
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - apparmor:unconfined

  nut-exporter:
    image: python:3-alpine
    container_name: nut-exporter
    ports:
      - 9999:9999
    environment:
      - NUT_HOST=10.0.0.10
      - NUT_PORT=3493
      - NUT_USER=monitor
      - NUT_PASSWORD=${NUT_PASSWORD}
    volumes:
      - /opt/monitoring/nut_exporter.py:/app/exporter.py:ro
    command: python /app/exporter.py
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - apparmor:unconfined

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - 9093:9093
    volumes:
      - /opt/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - apparmor:unconfined

  webhook:
    image: python:3-alpine
    container_name: webhook
    ports:
      - 5000:5000
    volumes:
      - /opt/monitoring/webhook/receiver.py:/app/receiver.py:ro
    command: python -u /app/receiver.py
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    security_opt:
      - apparmor:unconfined

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    security_opt:
      - apparmor:unconfined
    ports:
      - 3001:3001
    volumes:
      - uptime_kuma_data:/app/data
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g


volumes:
  prometheus_data:
  grafana_data:
  uptime_kuma_data:
    external: true
    name: monitoring_uptime_kuma_data
