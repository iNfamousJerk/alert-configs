
global:
  scrape_interval: 15s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/homelab_alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ─── Node Exporters (System Metrics) ─────────────────────
  - job_name: 'node_pve'
    static_configs:
      - targets:
          - '10.0.0.10:9100'
          - '10.0.0.11:9100'
          - '10.0.0.12:9100'  # PBS
    relabel_configs:
      - source_labels: [__address__]
        regex: '10\.0\.0\.10:9100'
        replacement: 'pve (10.0.0.10)'
        target_label: instance
      - source_labels: [__address__]
        regex: '10\.0\.0\.11:9100'
        replacement: 'pve2 (10.0.0.11)'
        target_label: instance
      - source_labels: [__address__]
        regex: '10\.0\.0\.12:9100'
        replacement: 'pbs (10.0.0.12)'
        target_label: instance

  - job_name: 'node_containers'
    static_configs:
      - targets:
          - '10.0.1.6:9100'
          - '10.0.1.1:9100'
          - '10.0.1.3:9100'
          - '10.0.1.7:9100'
          - '10.0.0.2:9100'
          - '10.0.1.8:9100'
          - '10.0.1.11:9100'  # librarr
          - '10.0.1.12:9100'  # media-server
          - '10.0.1.13:9100'  # tdarr
          - '10.0.1.18:9100'  # home assistant

  # ─── Docker Metrics ──────────────────────────────────────
  - job_name: 'cadvisor'
    static_configs:
      - targets:
          - '10.0.1.4:8080'   # homarr
          - '10.0.1.7:8080'   # monitoring
          - '10.0.1.11:8080'   # librarr
          - '10.0.1.12:8080'   # media-server
          - '10.0.1.14:8080'   # keycloak
          - '10.0.1.15:8080'   # snipe-it
          - '10.0.1.16:8080'   # osticket
          - '10.0.2.6:8080'   # arr-dash
          - '10.0.1.17:8080'   # gitea
          - '10.0.1.19:8080'   # paperless
          - '10.0.1.20:8082'   # nocodb (8080 taken)
          - '10.0.1.21:8080'   # vaultwarden
          - '10.0.1.22:8080'   # npm
          - '10.0.1.8:8082'   # media-stack (8080 taken)
          - '10.0.1.13:8080'   # tdarr
    relabel_configs:
      - source_labels: [__address__]
        regex: '10\.0\.1\.(\d+):(\d+)'
        replacement: 'ct$1:$2'
        target_label: instance

  # ─── Service & Infrastructure Probes ────────────────────
  - job_name: 'pihole'
    static_configs:
      - targets: ['10.0.1.7:9617']

  - job_name: 'nut'
    static_configs:
      - targets: ['10.0.1.7:9999']

  # HTTP probes — web UIs that accept plain HTTP
  - job_name: 'blackbox_http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          # Immich
          - http://10.0.1.1:2283
          # PiAlert
          # Pi-hole
          - http://10.0.0.2
          # Grafana
          # Uptime Kuma
          - http://10.0.1.7:3001
          - http://10.0.1.7:3000
          # Gitea
          - http://10.0.1.17:3002
          # Media Stack on PVE2
          - http://10.0.1.12:8096
          - http://10.0.1.11:7878
          - http://10.0.1.11:8989
          - http://10.0.1.11:8686
          - http://10.0.1.11:9696
          - http://10.0.1.11:6767
          - http://10.0.1.12:5055
          - http://10.0.1.8:8080
          - http://10.0.1.8:81
          - http://10.0.1.8:8787
          - http://10.0.1.8:13378
          # PVE2
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # TCP probes — services behind SSL or non-HTTP protocols
  - job_name: 'blackbox_tcp'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          # automation agent host
          - 10.0.1.6:22
          # NPM
          - 10.0.1.8:80
          - 10.0.0.10:8006
          - 10.0.0.10:22
          - 10.0.0.11:8006
          - 10.0.0.11:22
          - 10.0.0.12:8007
          - 10.0.0.12:22
          # Immich SSH
          - 10.0.1.1:22
          # Nextcloud SSH
          - 10.0.1.3:22
          # Media stack SSH
          - 10.0.1.8:22
          # Pi-hole DNS
          - 10.0.0.2:53
          # MicroMD SSH
          # Donetick SSH
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
